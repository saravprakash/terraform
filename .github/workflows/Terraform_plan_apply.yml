name: 'Terraform Plan and Apply'

on:
  workflow_dispatch:
    inputs:
      Configuration:
        type: choice
        description: 'Select Configuration'
        options:
          - 'Network'
          - 'AKS'
          - 'functionapp'
          - 'logicapp'
      Environment:
        type: choice
        description: 'Select Environment'
        options:
          - 'DEV'
          - 'UAT'
          - 'PROD'
      TerraformEnvironment:
        type: choice
        description: 'Select Terraform Environment'
        options:
          - 'DEV'
          - 'UAT'
          - 'PROD'
      lock_id:
        type: string
        description: 'Enter lock id to unlock the state file'
        default: ''
        required: false
      import_id:
        type: string
        description: 'Enter import id for the resource into the state file'
        default: ''
        required: false
      import_name:
        type: string
        description: 'Enter import name for the resource into the state file'
        default: ''
        required: false
      remove_resource_name:
        type: string
        description: 'Enter name for the resource to be removed from the state file'
        default: ''
        required: false


  # push:
  #   branches:
  #     - main
  

jobs:
  terraform_plan:
    environment: ${{github.event.inputs.Environment}}
    name: 'Terraform plan'
    env: 
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TerraformEnvironment: ${{github.event.inputs.TerraformEnvironment}}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: infrastructure/${{ github.event.inputs.Configuration }}
    
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: 'echo workspace'
        run: |
          pwd
          echo "github.workspace"
          echo ${{ github.workspace }}
          echo "GITHUB_WORKSPACE"
          echo $GITHUB_WORKSPACE
          echo "my working directory"
          echo $MY_WORK_DIR
          ls -al
        
      - name: 'Install terraform'
        run: |
          sudo apt-get update && sudo apt-get install -y gnupg software-properties-common
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null
          gpg --no-default-keyring --keyring /usr/share/keyrings/hashicorp-archive-keyring.gpg --fingerprint
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update
          sudo apt-get install terraform
    
      - name: 'Verify the installation'
        run: |
          terraform -help
          terraform -help plan

      # - name: 'Install and validate TFLINT'
      #   run: |
      #     curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      #     tflint --help
    

      - name: 'Initialize terraform'
        run: terraform init -backend-config=environments/${{ github.event.inputs.TerraformEnvironment }}/${{ github.event.inputs.TerraformEnvironment }}.tfbackend -var-file=environments/${{ github.event.inputs.TerraformEnvironment }}/${{ github.event.inputs.TerraformEnvironment }}.tfvars
        working-directory: infrastructure/${{ github.event.inputs.Configuration }}
        
      - name: 'Terraform plan'
        run: |
          if [ -n "${{ github.event.inputs.lock_id }}" ]; then
            terraform force-unlock -var-file=environments/${{ github.event.inputs.TerraformEnvironment }}/${{ github.event.inputs.TerraformEnvironment }}.tfvars ${{ github.event.inputs.lock_id }}
          fi

          if [ -n "${{ github.event.inputs.import_id }}" ] && [ -n "${{ github.event.inputs.import_name }}" ]; then
            terraform import -var-file=environments/${{ github.event.inputs.TerraformEnvironment }}/${{ github.event.inputs.TerraformEnvironment }}.tfvars ${{ github.event.inputs.import_name }} ${{ github.event.inputs.import_id }}
          fi
          
          if [ -n "${{ github.event.inputs.remove_resource_name }}" ]; then
            terraform state rm -var-file=environments/${{ github.event.inputs.TerraformEnvironment }}/${{ github.event.inputs.TerraformEnvironment }}.tfvars ${{ github.event.inputs.remove_resource_name }}
          fi

          terraform plan -var-file=environments/${{ github.event.inputs.TerraformEnvironment }}/${{ github.event.inputs.TerraformEnvironment }}.tfvars



  terraform_apply:
    environment: ${{github.event.inputs.Environment}}
    name: 'Terraform apply'
    needs: [terraform_plan]
    
    env: 
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: infrastructure/${{ github.event.inputs.Configuration }}

    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: 'echo workspace'
        run: |
          echo "github.workspace"
          echo ${{ github.workspace }}
          echo "GITHUB_WORKSPACE"
          echo $GITHUB_WORKSPACE
          echo "my working directory"
          echo $MY_WORK_DIR
          ls -al

      - name: 'Install terraform'
        run: |
          sudo apt-get update && sudo apt-get install -y gnupg software-properties-common
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null
          gpg --no-default-keyring --keyring /usr/share/keyrings/hashicorp-archive-keyring.gpg --fingerprint
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update
          sudo apt-get install terraform
    
      - name: 'Verify the installation'
        run: |
          terraform -help
          terraform -help plan

      # - name: 'Install and validate TFLINT'
      #   run: |
      #     curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      #     tflint --help
              

      - name: 'Initialize terraform'
        run: terraform init -backend-config=environments/${{ github.event.inputs.TerraformEnvironment }}/${{ github.event.inputs.TerraformEnvironment }}.tfbackend -var-file=environments/${{ github.event.inputs.TerraformEnvironment }}/${{ github.event.inputs.TerraformEnvironment }}.tfvars
        working-directory: infrastructure/${{ github.event.inputs.Configuration }}
        
      - name: 'Terraform apply'
        run: terraform apply -auto-approve -var-file=environments/${{ github.event.inputs.TerraformEnvironment }}/${{github.event.inputs.TerraformEnvironment}}.tfvars
        working-directory: infrastructure/${{ github.event.inputs.Configuration }}
      - name: 'terraform state'
        run: terraform state list 
        working-directory: infrastructure/${{ github.event.inputs.Configuration }}