name: 'Terraform Plan and Apply'

on:
  workflow_dispatch:
    inputs:
      Configuration:
        type: choice
        description: 'Select Configuration'
        options:
          - 'Network'
          - 'AKS'
          - 'functionapp'
          - 'logicapp'
      Environment:
        type: choice
        description: 'Select Environment'
        options:
          - 'DEV'
          - 'UAT'
          - 'PROD'
      TerraformEnvironment:
        type: choice
        description: 'Select Terraform Environment'
        options:
          - 'DEV'
          - 'UAT'
          - 'PROD'

  push:
    branches:
      - main
  

jobs:
  terraform_plan:
    environment: ${github.inputs.Environment}
    name: 'Terraform plan'
    env: 
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TerraformEnvironment: ${github.inputs.TerraformEnvironment}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: infrastructure/${github.inputs.Configuration}
    
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: 'echo workspace'
        run: |
          pwd
          
          echo "github.workspace"
          echo ${{ github.workspace }}
          echo "GITHUB_WORKSPACE"
          echo $GITHUB_WORKSPACE
          echo "my working directory"
          echo $MY_WORK_DIR
          ls -al
        
      - name: 'Install terraform'
        run: |
          sudo apt-get update && sudo apt-get install -y gnupg software-properties-common
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null
          gpg --no-default-keyring --keyring /usr/share/keyrings/hashicorp-archive-keyring.gpg --fingerprint
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update
          sudo apt-get install terraform
    
      - name: 'Verify the installation'
        run: |
          terraform -help
          terraform -help plan

      - name: 'Install and validate TFLINT'
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --help
    

      - name: 'Initialize terraform'
        run: terraform init -backend-config=environments/${github.event.inputs.Environment}.tfbackend -var-file=environments/${github.event.inputs.Environment}.tfvars
        working-directory: infrastructure/${github.inputs.Configuration}
        
      - name: 'Terraform plan'
        run: terraform plan


  terraform_apply:
    environment: DEV
    name: 'Terraform apply'
    needs: [terraform_plan]
    
    env: 
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: infrastructure/${github.inputs.Configuration}

    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: 'echo workspace'
        run: |
          echo "github.workspace"
          echo ${{ github.workspace }}
          echo "GITHUB_WORKSPACE"
          echo $GITHUB_WORKSPACE
          echo "my working directory"
          echo $MY_WORK_DIR
          ls -al

      - name: 'Initialize terraform'
        run: terraform init
        
      - name: 'Terraform apply'
        run: terraform apply -auto-approve -backend-config=environments/${github.event.inputs.Environment}.tfbackend -var-file=environments/${github.event.inputs.Environment}.tfvars

      - name: 'terraform state'
        run: terraform state list -backend-config=environments/${github.event.inputs.Environment}.tfbackend -var-file=environments/${github.event.inputs.Environment}.tfvars